name: Run compile fixes
on:
  push:
    branches: [main]
    paths:
      - 'fix_compile.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrections
        run: python fix_compile.py
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts
          git diff --cached --quiet || git commit -m 'fix: correct async authorization mutations [security-fix]'
          git push
