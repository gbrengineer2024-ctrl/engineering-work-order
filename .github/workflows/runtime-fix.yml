name: Fix runtime ID collisions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[runtime-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch collision-prone IDs
        shell: python
        run: |
          from pathlib import Path
          for name in ('server/db.ts', 'server/routers.ts'):
              p = Path(name)
              s = p.read_text()
              s = s.replace('`LOG-${Date.now()}`', '`LOG-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`')
              s = s.replace('`NTF-${Date.now()}`', '`NTF-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`')
              s = s.replace('`ATT-${Date.now()}`', '`ATT-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`')
              s = s.replace('`PART-${Date.now()}`', '`PART-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`')
              p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/db.ts server/routers.ts
          git diff --cached --quiet || git commit -m 'fix: prevent runtime ID collisions [runtime-fix]'
          git push
