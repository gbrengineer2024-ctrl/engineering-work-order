name: Run security fix
on:
  push:
    branches: [main]
    paths:
      - 'apply_security_fixes.py'
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[security-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python apply_security_fixes.py
      - name: Commit patched code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routers.ts server/db.ts
          git diff --cached --quiet || git commit -m 'fix: enforce work order authorization and status transitions [security-fix]'
          git push
